plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.ensm'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-crypto'
    
    // JWT
    implementation("io.jsonwebtoken:jjwt-api:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.11.5")
    
    // YAML 처리
    implementation 'org.yaml:snakeyaml:2.2'
    
    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Spring Boot 3.2.0의 새로운 로더 구현 버그 회피를 위해 CLASSIC 로더 사용
import org.springframework.boot.loader.tools.LoaderImplementation

bootJar {
    loaderImplementation = LoaderImplementation.CLASSIC
}

// 프론트엔드 - static/main/src 폴더 사용
def frontendDir = "$projectDir/src/main/resources/static/main"

sourceSets {
    main {
        resources {
            srcDirs = ["$projectDir/src/main/resources"]
        }
    }
}

processResources {
    dependsOn "copyReactBuildFiles"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    
    // descriptions 폴더를 명시적으로 포함 (copyReactBuildFiles 이후에도 보존)
    // 원본 위치에서 직접 복사하여 덮어쓰기 방지
    from("$projectDir/src/main/resources/static/main/descriptions") {
        into "static/main/descriptions"
        include "**/*.md"
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        // 원본 파일이 존재하는지 확인
        doFirst {
            def descriptionsDir = file("$projectDir/src/main/resources/static/main/descriptions")
            if (!descriptionsDir.exists()) {
                println "경고: descriptions 폴더가 없습니다: $descriptionsDir"
            } else {
                println "descriptions 폴더 복사: $descriptionsDir -> static/main/descriptions"
            }
        }
    }
}

task cleanNodeModules(type: Delete) {
    delete "$frontendDir/node_modules"
    delete "$frontendDir/package-lock.json"
    // 이전 빌드 폴더도 삭제하여 손상된 파일 방지
    delete "$frontendDir/build"
}

task installAjv(type: Exec) {
    dependsOn "cleanNodeModules"
    workingDir frontendDir
    group = BasePlugin.BUILD_GROUP
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        // ajv와 ajv-keywords를 먼저 설치하여 버전 충돌 방지
        commandLine 'cmd', '/c', 'npm.cmd', 'install', 'ajv@^8.12.0', 'ajv-keywords@^5.1.0', '--legacy-peer-deps', '--force'
    } else {
        commandLine 'npm', 'install', 'ajv@^8.12.0', 'ajv-keywords@^5.1.0', '--legacy-peer-deps', '--force'
    }
}

task installReact(type: Exec) {
    dependsOn "installAjv"
    workingDir frontendDir
    inputs.dir frontendDir
    group = BasePlugin.BUILD_GROUP
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', 'npm.cmd', 'install', '--legacy-peer-deps', '--force'
    } else {
        commandLine 'npm', 'install', '--legacy-peer-deps', '--force'
    }
}

task buildReact(type: Exec) {
    dependsOn "installReact"
    workingDir frontendDir
    inputs.dir frontendDir
    group = BasePlugin.BUILD_GROUP
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
    // 오류 출력을 표준 출력으로 리다이렉트
    standardOutput = System.out
    errorOutput = System.err
    // 항상 빌드 실행 (cleanNodeModules에서 build 폴더 삭제)
    // 빌드 실패 시 오류 발생 (JAR 손상 방지)
}

task copyReactBuildFiles(type: Copy) {
    dependsOn "buildReact"
    from "$frontendDir/build"
    into "$projectDir/src/main/resources/static/main"
    // descriptions 폴더는 보존 (덮어쓰지 않음)
    exclude "descriptions/**"
    // 빌드 폴더가 없으면 오류 발생 (JAR 손상 방지)
    doFirst {
        if (!file("$frontendDir/build").exists()) {
            throw new GradleException("React 빌드 폴더가 없습니다: $frontendDir/build. React 빌드를 먼저 완료해주세요.")
        }
        if (!file("$frontendDir/build/index.html").exists()) {
            throw new GradleException("React 빌드가 완료되지 않았습니다: $frontendDir/build/index.html이 없습니다.")
        }
        // descriptions 폴더가 존재하는지 확인
        def descriptionsDir = file("$projectDir/src/main/resources/static/main/descriptions")
        if (descriptionsDir.exists()) {
            println "descriptions 폴더 보존: $descriptionsDir (덮어쓰지 않음)"
        }
    }
}

